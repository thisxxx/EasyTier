name: Verify mini build

# B 档 feature + profile.mini，并在 x86 上真跑一次 --help 验证二进制可用。
on:
  workflow_dispatch:
  push:
    branches: ["feature/lite"]
    paths:
      - ".github/workflows/measure-verify.yml"

defaults:
  run:
    shell: bash

jobs:
  verify:
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - NAME: mipsel-b-z
            TARGET: mipsel-unknown-linux-musl
            CROSS: true
          - NAME: x86-b-z
            TARGET: x86_64-unknown-linux-musl
            CROSS: false

    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Prepare build environment
        uses: ./.github/actions/prepare-build
        with:
          target: ${{ matrix.TARGET }}
          gui: false
          pnpm: false
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply B feature set
        run: |
          python3 -c 'import re
          feats=["aes-gcm","smoltcp","kcp","faketcp","logging","management-rpc","proxy-cidr-monitor"]
          p="easytier-contrib/easytier-lite/Cargo.toml"
          s=open(p).read()
          body="".join("    \"%s\",\n" % f for f in feats)
          s2=re.sub(r"(easytier = \{ workspace = true, features = \[)[^\]]*(\])", lambda m: m.group(1)+"\n"+body+m.group(2), s, flags=re.S)
          open(p,"w").write(s2)
          '

      - name: Build (profile mini)
        env:
          RUSTC_BOOTSTRAP: "1"
        run: |
          set -o pipefail
          if [[ "${{ matrix.CROSS }}" == "true" ]]; then
            cargo build --profile mini --target ${{ matrix.TARGET }} \
              -Z build-std=std,panic_abort --package easytier-lite 2>&1 | tail -20
          else
            cargo build --profile mini --target ${{ matrix.TARGET }} \
              --package easytier-lite 2>&1 | tail -20
          fi

      - name: Smoke test (x86 only)
        if: ${{ matrix.CROSS == false }}
        run: |
          BIN="target/${{ matrix.TARGET }}/mini/easytier-lite"
          echo "--- file ---"; file "$BIN"
          echo "--- --help ---"; "$BIN" --help || echo "HELP EXIT=$?"
          echo "--- no args (expect config error, not panic) ---"
          timeout 10 "$BIN" --network-name test --network-secret x --no-listener --console-log-level warn || echo "RUN EXIT=$?"

      - name: Report size
        run: |
          BIN="target/${{ matrix.TARGET }}/mini/easytier-lite"
          echo "======== ${{ matrix.NAME }} ========"
          echo "raw   : $(stat -c %s "$BIN") bytes"
          curl -sL "https://github.com/upx/upx/releases/download/v4.2.4/upx-4.2.4-amd64_linux.tar.xz" | tar xJf -
          ./upx-4.2.4-amd64_linux/upx --lzma --best -q -o /tmp/upxed "$BIN" || true
          echo "upx   : $(stat -c %s /tmp/upxed 2>/dev/null || echo n/a) bytes"
          ./upx-4.2.4-amd64_linux/upx -t /tmp/upxed | tail -3 || true
