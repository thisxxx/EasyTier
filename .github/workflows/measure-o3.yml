name: Measure o3 hotspots

# B 档 + profile.mini，但把 aes-gcm / smoltcp 这两个热点单独拉回 opt-level=3，
# 看体积代价是多少。
on:
  workflow_dispatch:
  push:
    branches: ["feature/lite"]
    paths:
      - ".github/workflows/measure-o3.yml"

defaults:
  run:
    shell: bash

jobs:
  verify:
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - NAME: mipsel-b-z-o3hot
            TARGET: mipsel-unknown-linux-musl
            CROSS: true
          - NAME: x86-b-z-o3hot
            TARGET: x86_64-unknown-linux-musl
            CROSS: false

    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Prepare build environment
        uses: ./.github/actions/prepare-build
        with:
          target: ${{ matrix.TARGET }}
          gui: false
          pnpm: false
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply B feature set + o3 hotspots
        run: |
          python3 .github/measure_apply.py
          grep -A6 'profile.mini.package' Cargo.toml | tail -20

      - name: Build (profile mini)
        env:
          RUSTC_BOOTSTRAP: "1"
        run: |
          set -o pipefail
          if [[ "${{ matrix.CROSS }}" == "true" ]]; then
            cargo build --profile mini --target ${{ matrix.TARGET }} \
              -Z build-std=std,panic_abort --package easytier-lite 2>&1 | tail -20
          else
            cargo build --profile mini --target ${{ matrix.TARGET }} \
              --package easytier-lite 2>&1 | tail -20
          fi

      - name: Smoke test (x86 only)
        if: ${{ matrix.CROSS == false }}
        run: |
          BIN="target/${{ matrix.TARGET }}/mini/easytier-lite"
          "$BIN" --help > /dev/null && echo "HELP OK" || echo "HELP EXIT=$?"
          timeout 10 "$BIN" --network-name test --network-secret x --no-listener \
            --console-log-level error || echo "RUN EXIT=$?"

      - name: Report size
        run: |
          BIN="target/${{ matrix.TARGET }}/mini/easytier-lite"
          echo "======== ${{ matrix.NAME }} ========"
          echo "raw   : $(stat -c %s "$BIN") bytes"
          curl -sL "https://github.com/upx/upx/releases/download/v4.2.4/upx-4.2.4-amd64_linux.tar.xz" | tar xJf -
          ./upx-4.2.4-amd64_linux/upx --lzma --best -q -o /tmp/upxed "$BIN" || true
          echo "upx   : $(stat -c %s /tmp/upxed 2>/dev/null || echo n/a) bytes"
          ./upx-4.2.4-amd64_linux/upx -t /tmp/upxed | tail -3 || true
