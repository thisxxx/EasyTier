name: EasyTier Lite

on:
  workflow_dispatch:
  push:
    branches: ["feature/lite"]
    paths:
      - "easytier-contrib/easytier-lite/**"
      - "easytier/**"
      - "easytier-core/**"
      - "easytier-proto/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".github/workflows/lite.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Bump this when the binary actually changes behaviour; the release tag
  # also carries the build date and commit so every build keeps its own entry.
  LITE_VERSION: "0.2.1"

permissions:
  contents: write

defaults:
  run:
    shell: bash

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - TARGET: x86_64-unknown-linux-musl
            OS: ubuntu-24.04
            ARTIFACT_NAME: linux-x86_64
          - TARGET: aarch64-unknown-linux-musl
            OS: ubuntu-24.04-arm
            ARTIFACT_NAME: linux-aarch64

          - TARGET: riscv64gc-unknown-linux-musl
            OS: ubuntu-24.04
            ARTIFACT_NAME: linux-riscv64
          - TARGET: loongarch64-unknown-linux-musl
            OS: ubuntu-24.04
            ARTIFACT_NAME: linux-loongarch64

          - TARGET: armv7-unknown-linux-musleabihf
            OS: ubuntu-24.04
            ARTIFACT_NAME: linux-armv7hf
          - TARGET: armv7-unknown-linux-musleabi
            OS: ubuntu-24.04
            ARTIFACT_NAME: linux-armv7
          - TARGET: arm-unknown-linux-musleabihf
            OS: ubuntu-24.04
            ARTIFACT_NAME: linux-armhf
          - TARGET: arm-unknown-linux-musleabi
            OS: ubuntu-24.04
            ARTIFACT_NAME: linux-arm

          - TARGET: mips-unknown-linux-musl
            OS: ubuntu-24.04
            ARTIFACT_NAME: linux-mips
          - TARGET: mipsel-unknown-linux-musl
            OS: ubuntu-24.04
            ARTIFACT_NAME: linux-mipsel

          - TARGET: x86_64-unknown-freebsd
            OS: ubuntu-24.04
            ARTIFACT_NAME: freebsd-13.2-x86_64
            BSD_VERSION: 13.2

          - TARGET: x86_64-apple-darwin
            OS: macos-latest
            ARTIFACT_NAME: macos-x86_64
          - TARGET: aarch64-apple-darwin
            OS: macos-latest
            ARTIFACT_NAME: macos-aarch64

          - TARGET: x86_64-pc-windows-msvc
            OS: windows-latest
            ARTIFACT_NAME: windows-x86_64
          - TARGET: i686-pc-windows-msvc
            OS: windows-latest
            ARTIFACT_NAME: windows-i686
          - TARGET: aarch64-pc-windows-msvc
            OS: windows-11-arm
            ARTIFACT_NAME: windows-arm64

    runs-on: ${{ matrix.OS }}
    env:
      TARGET: ${{ matrix.TARGET }}
    steps:
      - uses: actions/checkout@v5

      - name: Prepare build environment
        uses: ./.github/actions/prepare-build
        with:
          target: ${{ matrix.TARGET }}
          gui: false
          pnpm: false
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: lite-${{ matrix.TARGET }}
          cache-targets: true

      # Every target that the host cannot build natively goes through zig;
      # upstream pins both of these for the same reason.
      - uses: mlugg/setup-zig@v2
        if: ${{ contains(matrix.OS, 'ubuntu') }}
        with:
          version: 0.16.0
          use-cache: true

      - uses: taiki-e/install-action@v2
        if: ${{ contains(matrix.OS, 'ubuntu') }}
        with:
          tool: cargo-zigbuild@0.23.2

      - name: Build easytier-lite
        env:
          RUSTC_BOOTSTRAP: ${{ contains(matrix.TARGET, 'mips') && '1' || '' }}
        run: |
          if [[ "$TARGET" == *windows* ]]; then
            SUFFIX=.exe
          else
            SUFFIX=""
          fi

          if [[ "$TARGET" =~ (x86_64-unknown-linux-musl|aarch64-unknown-linux-musl|windows|darwin) ]]; then
            BUILD=build
          else
            BUILD=zigbuild
          fi

          # mips targets are not supported by zig, upstream builds them with
          # build-std against the musl-cross toolchain installed above.
          if [[ "$TARGET" =~ ^mips ]]; then
            cargo build --profile mini --target "$TARGET" \
              -Z build-std=std,panic_abort --package easytier-lite
          else
            cargo "$BUILD" --profile mini --target "$TARGET" --package easytier-lite
          fi

          BIN="target/$TARGET/mini/easytier-lite$SUFFIX"
          ls -l "$BIN"
          du -h "$BIN"

      - name: Pin the binary name
        run: |
          if [[ "$TARGET" == *windows* ]]; then
            SUFFIX=.exe
          else
            SUFFIX=""
          fi
          SRC="target/$TARGET/mini/easytier-lite$SUFFIX"
          mkdir -p dist
          cp "$SRC" "dist/easytier-lite-${{ matrix.ARTIFACT_NAME }}$SUFFIX"

      # Strip where a host toolchain provides one, then UPX-pack every target:
      # UPX understands ELF (linux/freebsd/mips), PE (windows) and Mach-O (macos).
      # A format it refuses keeps the original binary and only emits a warning,
      # so one exotic target can never fail the whole matrix.
      - name: Strip and UPX
        run: |
          if [[ "$TARGET" == *windows* ]]; then
            SUFFIX=.exe
          else
            SUFFIX=""
          fi
          BIN="dist/easytier-lite-${{ matrix.ARTIFACT_NAME }}$SUFFIX"

          if [[ "$RUNNER_OS" == "Linux" ]]; then
            if [[ "$TARGET" == *linux* && ! "$TARGET" =~ ^mips ]]; then
              strip "$BIN" || true
            fi
            UPX_VERSION=4.2.4
            curl -sL "https://github.com/upx/upx/releases/download/v${UPX_VERSION}/upx-${UPX_VERSION}-amd64_linux.tar.xz" | tar xJf -
            UPX=./upx-${UPX_VERSION}-amd64_linux/upx
          elif [[ "$RUNNER_OS" == "Windows" ]]; then
            curl -sLo upx.zip "https://github.com/upx/upx/releases/download/v4.2.4/upx-4.2.4-win64.zip"
            unzip -oq upx.zip
            UPX=./upx-4.2.4-win64/upx.exe
          else
            brew install upx
            UPX=upx
          fi

          echo "== before =="
          ls -l "$BIN"
          du -h "$BIN"
          "$UPX" --lzma --best "$BIN" || echo "::warning::upx skipped for $TARGET"
          echo "== after =="
          ls -l "$BIN"
          du -h dist/*

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: easytier-lite-${{ matrix.ARTIFACT_NAME }}
          path: dist/*
          if-no-files-found: error

  publish:
    needs: build
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    steps:
      - name: Download every built target
        uses: actions/download-artifact@v4
        with:
          pattern: easytier-lite-*
          path: out

      - name: Zip per platform
        run: |
          mkdir -p assets
          cd out
          for d in */; do
            name="${d%/}"
            (cd "$name" && zip -9 -r "../../assets/$name.zip" .)
          done
          ls -l ../assets

      - name: Compute the release tag
        id: meta
        run: |
          DATE=$(date -u +%Y%m%d)
          SHA7="${GITHUB_SHA::7}"
          echo "tag=lite-v${{ env.LITE_VERSION }}-${DATE}-${SHA7}" >> "$GITHUB_OUTPUT"

      - name: Publish versioned release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: easytier-lite v${{ env.LITE_VERSION }} (${{ steps.meta.outputs.tag }})
          prerelease: true
          body: |
            Rolling multi-platform build of `easytier-lite` from `${{ github.ref_name }}`
            (commit `${{ github.sha }}`).

            `easytier-lite` is a command-line-only EasyTier node for small routers:
            it exports a LAN subnet to the virtual network (`--proxy-networks`) and
            gates foreign networks with `--private-group`. It carries no config file,
            no config server and no clap — ten flags are the whole surface.

            Linux binaries are static musl, UPX packed. Every target is UPX
            (lzma) packed when the format is supported; binaries UPX cannot
            handle ship as plain release builds.
          files: assets/*.zip
          fail_on_unmatched_files: true
