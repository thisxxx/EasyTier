name: EasyTier Lite

on:
  workflow_dispatch:
  push:
    branches: ["feature/lite"]
    paths:
      - "easytier-contrib/easytier-lite/**"
      - "easytier/**"
      - "easytier-core/**"
      - "easytier-proto/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".github/workflows/lite.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write

defaults:
  run:
    shell: bash

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - TARGET: x86_64-unknown-linux-musl
            OS: ubuntu-24.04
            ARTIFACT_NAME: linux-x86_64
          - TARGET: aarch64-unknown-linux-musl
            OS: ubuntu-24.04-arm
            ARTIFACT_NAME: linux-aarch64

          - TARGET: riscv64gc-unknown-linux-musl
            OS: ubuntu-24.04
            ARTIFACT_NAME: linux-riscv64
          - TARGET: loongarch64-unknown-linux-musl
            OS: ubuntu-24.04
            ARTIFACT_NAME: linux-loongarch64

          - TARGET: armv7-unknown-linux-musleabihf
            OS: ubuntu-24.04
            ARTIFACT_NAME: linux-armv7hf
          - TARGET: armv7-unknown-linux-musleabi
            OS: ubuntu-24.04
            ARTIFACT_NAME: linux-armv7
          - TARGET: arm-unknown-linux-musleabihf
            OS: ubuntu-24.04
            ARTIFACT_NAME: linux-armhf
          - TARGET: arm-unknown-linux-musleabi
            OS: ubuntu-24.04
            ARTIFACT_NAME: linux-arm

          - TARGET: mips-unknown-linux-musl
            OS: ubuntu-24.04
            ARTIFACT_NAME: linux-mips
          - TARGET: mipsel-unknown-linux-musl
            OS: ubuntu-24.04
            ARTIFACT_NAME: linux-mipsel

          - TARGET: x86_64-unknown-freebsd
            OS: ubuntu-24.04
            ARTIFACT_NAME: freebsd-13.2-x86_64
            BSD_VERSION: 13.2

          - TARGET: x86_64-apple-darwin
            OS: macos-latest
            ARTIFACT_NAME: macos-x86_64
          - TARGET: aarch64-apple-darwin
            OS: macos-latest
            ARTIFACT_NAME: macos-aarch64

          - TARGET: x86_64-pc-windows-msvc
            OS: windows-latest
            ARTIFACT_NAME: windows-x86_64
          - TARGET: i686-pc-windows-msvc
            OS: windows-latest
            ARTIFACT_NAME: windows-i686
          - TARGET: aarch64-pc-windows-msvc
            OS: windows-11-arm
            ARTIFACT_NAME: windows-arm64

    runs-on: ${{ matrix.OS }}
    env:
      TARGET: ${{ matrix.TARGET }}
    steps:
      - uses: actions/checkout@v5

      - name: Prepare build environment
        uses: ./.github/actions/prepare-build
        with:
          target: ${{ matrix.TARGET }}
          gui: false
          pnpm: false
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: lite-${{ matrix.TARGET }}
          cache-targets: true

      # Every target that the host cannot build natively goes through zig;
      # upstream pins both of these for the same reason.
      - uses: mlugg/setup-zig@v2
        if: ${{ contains(matrix.OS, 'ubuntu') }}
        with:
          version: 0.16.0
          use-cache: true

      - uses: taiki-e/install-action@v2
        if: ${{ contains(matrix.OS, 'ubuntu') }}
        with:
          tool: cargo-zigbuild@0.23.2

      - name: Build easytier-lite
        env:
          RUSTC_BOOTSTRAP: ${{ contains(matrix.TARGET, 'mips') && '1' || '' }}
        run: |
          if [[ "$TARGET" == *windows* ]]; then
            SUFFIX=.exe
          else
            SUFFIX=""
          fi

          if [[ "$TARGET" =~ (x86_64-unknown-linux-musl|aarch64-unknown-linux-musl|windows|darwin) ]]; then
            BUILD=build
          else
            BUILD=zigbuild
          fi

          # mips targets are not supported by zig, upstream builds them with
          # build-std against the musl-cross toolchain installed above.
          if [[ "$TARGET" =~ ^mips ]]; then
            cargo build -r --target "$TARGET" -Z build-std=std,panic_abort \
              --package easytier-lite
          else
            cargo "$BUILD" --release --target "$TARGET" --package easytier-lite
          fi

          BIN="target/$TARGET/release/easytier-lite$SUFFIX"
          ls -l "$BIN"
          du -h "$BIN"

      - name: Pin the binary name
        run: |
          if [[ "$TARGET" == *windows* ]]; then
            SUFFIX=.exe
          else
            SUFFIX=""
          fi
          SRC="target/$TARGET/release/easytier-lite$SUFFIX"
          mkdir -p dist
          cp "$SRC" "dist/easytier-lite-${{ matrix.ARTIFACT_NAME }}$SUFFIX"

          # Shrink Linux images: strip always, then UPX (same as the official
          # release). Skipped where strip/upx do not understand the target.
          if [[ "$TARGET" == *linux* && ! "$TARGET" =~ ^mips ]]; then
            strip "dist/easytier-lite-${{ matrix.ARTIFACT_NAME }}$SUFFIX" || true
            UPX_VERSION=4.2.4
            curl -sL "https://github.com/upx/upx/releases/download/v${UPX_VERSION}/upx-${UPX_VERSION}-amd64_linux.tar.xz" | tar xJf -
            ./upx-${UPX_VERSION}-amd64_linux/upx --lzma --best \
              "dist/easytier-lite-${{ matrix.ARTIFACT_NAME }}$SUFFIX" || true
          fi
          du -h dist/*

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: easytier-lite-${{ matrix.ARTIFACT_NAME }}
          path: dist/*
          if-no-files-found: error

  publish:
    needs: build
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    steps:
      - name: Download every built target
        uses: actions/download-artifact@v4
        with:
          pattern: easytier-lite-*
          path: out

      - name: Zip per platform
        run: |
          mkdir -p assets
          cd out
          for d in */; do
            name="${d%/}"
            (cd "$name" && zip -9 -r "../../assets/$name.zip" .)
          done
          ls -l ../assets

      - name: Publish rolling release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: lite-latest
          name: easytier-lite (latest build)
          prerelease: true
          body: |
            Rolling multi-platform build of `easytier-lite` from `${{ github.ref_name }}`
            (commit `${{ github.sha }}`).

            `easytier-lite` is a command-line-only EasyTier node for small routers:
            it exports a LAN subnet to the virtual network (`--proxy-networks`) and
            gates foreign networks with `--private-group`. It carries no config file,
            no config server and no clap — ten flags are the whole surface.

            Linux binaries are static musl, UPX packed. Windows/macOS/FreeBSD builds
            are plain release builds.
          files: assets/*.zip
          fail_on_unmatched_files: true
