name: EasyTier Lite

on:
  workflow_dispatch:
  push:
    branches: ["feature/lite"]
    paths:
      - "easytier-contrib/easytier-lite/**"
      - "easytier/**"
      - "easytier-core/**"
      - "easytier-proto/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".github/workflows/lite.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - TARGET: x86_64-unknown-linux-musl
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -qqy build-essential musl-tools
          which musl-gcc

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.95"
          targets: ${{ matrix.TARGET }}

      - name: Setup protoc
        uses: arduino/setup-protoc@v3
        with:
          version: "35.1"
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: lite-${{ matrix.TARGET }}
          cache-targets: true

      - name: Build easytier-lite
        run: |
          cargo build --release --target ${{ matrix.TARGET }} -p easytier-lite
          ls -l target/${{ matrix.TARGET }}/release/easytier-lite
          du -h target/${{ matrix.TARGET }}/release/easytier-lite

      - name: Compress
        run: |
          mkdir -p artifacts
          BIN=target/${{ matrix.TARGET }}/release/easytier-lite
          strip "$BIN"
          echo "== stripped =="
          du -h "$BIN"

          # Same treatment as the official release: UPX the final binary so the
          # image on the router is as small as possible.
          UPX_VERSION=4.2.4
          curl -sL "https://github.com/upx/upx/releases/download/v${UPX_VERSION}/upx-${UPX_VERSION}-amd64_linux.tar.xz" | tar xJf -
          ./upx-${UPX_VERSION}-amd64_linux/upx --lzma --best "$BIN"
          echo "== after upx =="
          du -h "$BIN"

          cp "$BIN" artifacts/
          cd artifacts && zip -9 easytier-lite-${{ matrix.TARGET }}.zip easytier-lite

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: easytier-lite-${{ matrix.TARGET }}
          path: artifacts/easytier-lite-${{ matrix.TARGET }}.zip
          if-no-files-found: error
