name: Measure mipsel sizes

# 在 mipsel 上验证裁剪效果（这是路由实际用的架构）。
on:
  workflow_dispatch:
  push:
    branches: ["feature/lite"]
    paths:
      - ".github/workflows/measure-mipsel.yml"

defaults:
  run:
    shell: bash

jobs:
  measure:
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - NAME: mipsel-current
            FEATURES: ""
          - NAME: mipsel-min
            FEATURES: "aes-gcm,smoltcp,logging,management-rpc,proxy-cidr-monitor"
          - NAME: mipsel-min-kcp
            FEATURES: "aes-gcm,smoltcp,logging,management-rpc,proxy-cidr-monitor,kcp,faketcp"

    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Prepare build environment
        uses: ./.github/actions/prepare-build
        with:
          target: mipsel-unknown-linux-musl
          gui: false
          pnpm: false
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply feature set
        env:
          FEATURES: ${{ matrix.FEATURES }}
        run: |
          if [[ -z "$FEATURES" ]]; then
            echo "keeping default lite feature set"
            exit 0
          fi
          python3 -c 'import re,sys
          feats=sys.argv[1].split(",")
          p="easytier-contrib/easytier-lite/Cargo.toml"
          s=open(p).read()
          body="".join("    \"%s\",\n" % f for f in feats)
          s2=re.sub(r"(easytier = \{ workspace = true, features = \[)[^\]]*(\])", lambda m: m.group(1)+"\n"+body+m.group(2), s, flags=re.S)
          open(p,"w").write(s2)
          ' "$FEATURES"

      - name: Build
        env:
          RUSTC_BOOTSTRAP: "1"
        run: |
          set -o pipefail
          cargo build -r --target mipsel-unknown-linux-musl \
            -Z build-std=std,panic_abort --package easytier-lite 2>&1 | tail -30

      - name: Report size
        run: |
          BIN="target/mipsel-unknown-linux-musl/release/easytier-lite"
          cp "$BIN" /tmp/raw
          echo "======== ${{ matrix.NAME }} (features='${{ matrix.FEATURES }}') ========"
          echo "raw   : $(stat -c %s /tmp/raw) bytes"
          ls -l "$BIN"
          curl -sL "https://github.com/upx/upx/releases/download/v4.2.4/upx-4.2.4-amd64_linux.tar.xz" | tar xJf -
          ./upx-4.2.4-amd64_linux/upx --lzma --best -q -o /tmp/upxed /tmp/raw || true
          echo "upx   : $(stat -c %s /tmp/upxed 2>/dev/null || echo n/a) bytes"
