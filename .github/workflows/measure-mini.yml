name: Measure mini profile

# 同一套 feature，改用 profile.mini（opt-level="z"）看还能压多少。
on:
  workflow_dispatch:
  push:
    branches: ["feature/lite"]
    paths:
      - ".github/workflows/measure-mini.yml"

defaults:
  run:
    shell: bash

jobs:
  measure:
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - NAME: mipsel-min-z
            TARGET: mipsel-unknown-linux-musl
            CROSS: true
          - NAME: x86-min-z
            TARGET: x86_64-unknown-linux-musl
            CROSS: false

    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Prepare build environment
        uses: ./.github/actions/prepare-build
        with:
          target: ${{ matrix.TARGET }}
          gui: false
          pnpm: false
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply min feature set
        run: |
          python3 -c 'import re
          feats=["aes-gcm","smoltcp","logging","management-rpc","proxy-cidr-monitor"]
          p="easytier-contrib/easytier-lite/Cargo.toml"
          s=open(p).read()
          body="".join("    \"%s\",\n" % f for f in feats)
          s2=re.sub(r"(easytier = \{ workspace = true, features = \[)[^\]]*(\])", lambda m: m.group(1)+"\n"+body+m.group(2), s, flags=re.S)
          open(p,"w").write(s2)
          '

      - name: Build (profile mini)
        env:
          RUSTC_BOOTSTRAP: "1"
        run: |
          set -o pipefail
          if [[ "${{ matrix.CROSS }}" == "true" ]]; then
            cargo build --profile mini --target ${{ matrix.TARGET }} \
              -Z build-std=std,panic_abort --package easytier-lite 2>&1 | tail -20
          else
            cargo build --profile mini --target ${{ matrix.TARGET }} \
              --package easytier-lite 2>&1 | tail -20
          fi

      - name: Report size
        run: |
          BIN="target/${{ matrix.TARGET }}/mini/easytier-lite"
          ls -l "$BIN"
          echo "======== ${{ matrix.NAME }} ========"
          echo "raw   : $(stat -c %s "$BIN") bytes"
          curl -sL "https://github.com/upx/upx/releases/download/v4.2.4/upx-4.2.4-amd64_linux.tar.xz" | tar xJf -
          ./upx-4.2.4-amd64_linux/upx --lzma --best -q -o /tmp/upxed "$BIN" || true
          echo "upx   : $(stat -c %s /tmp/upxed 2>/dev/null || echo n/a) bytes"
