name: Measure feature sizes

# 一次性体积测量：同一套代码在不同 feature 组合下的二进制大小。
# 结果只打印到日志，不产出 artifact。
on:
  workflow_dispatch:
  push:
    branches: ["feature/lite"]
    paths:
      - ".github/workflows/measure-features.yml"

defaults:
  run:
    shell: bash

jobs:
  measure:
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        include:
          # 2.3.2 —— 基线 / +smoltcp / +tun / 两者都有
          - NAME: "232-min"
            REF: v2.3.2
            FEATURES: "aes-gcm"
          - NAME: "232-smoltcp"
            REF: v2.3.2
            FEATURES: "aes-gcm,smoltcp"
          - NAME: "232-tun"
            REF: v2.3.2
            FEATURES: "aes-gcm,tun"
          - NAME: "232-both"
            REF: v2.3.2
            FEATURES: "aes-gcm,smoltcp,tun"
          # 2.0.2 —— 同样两组，用于对比同 feature 下的代际差
          - NAME: "202-tun"
            REF: v2.0.2
            FEATURES: "aes-gcm,tun"
          - NAME: "202-both"
            REF: v2.0.2
            FEATURES: "aes-gcm,smoltcp,tun"

    runs-on: ubuntu-24.04
    steps:
      - name: Install toolchain deps
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential musl-tools protobuf-compiler binutils

      - name: Fetch source
        run: |
          git clone --depth 1 --branch "${{ matrix.REF }}" \
            https://github.com/EasyTier/EasyTier.git src

      - name: Add musl target
        working-directory: src
        run: rustup target add x86_64-unknown-linux-musl

      - name: Build (${{ matrix.FEATURES }})
        working-directory: src
        run: |
          set -o pipefail
          cargo build --release --target x86_64-unknown-linux-musl \
            --package easytier --bin easytier-core \
            --no-default-features --features "${{ matrix.FEATURES }}" 2>&1 | tail -30

      - name: Show resolved features
        working-directory: src
        run: cargo tree --package easytier -e features --depth 1 2>/dev/null | head -30 || true

      - name: Report size
        working-directory: src
        run: |
          BIN="target/x86_64-unknown-linux-musl/release/easytier-core"
          cp "$BIN" /tmp/raw
          strip "$BIN"
          echo "======== ${{ matrix.NAME }} (ref ${{ matrix.REF }}, features=${{ matrix.FEATURES }}) ========"
          echo "raw   : $(stat -c %s /tmp/raw) bytes"
          echo "strip : $(stat -c %s "$BIN") bytes"
          size "$BIN"
